<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Second Bean</title>
</head>

<body style="background-color: black;">
    <header>
        <div class="left-header">
            <div>
                <img src="second bean-Photoroom.png" alt="cafe-logo" style="width: 120px;
                    margin-right: 40px;
                    margin-left: 30px;">
            </div>
            <div class="middle-header">
                <p class="top-bar-menu">About</p>
                <p class="top-bar-menu">Menu</p>
                <p class="top-bar-menu">Career</p>
                <p class="top-bar-menu">Location</p>
            </div>
        </div>
        <div class="right-header">
            <img class="icon" src="instagram.png" alt="instagram">

            <img class="icon" src="facebook.png" alt="facebook">

            <img class="icon" src="home.png" alt="home">
        </div>
    </header>

    <section>
        <img class="cafe-header" src="cafe-header.jpg" alt="cafe-interior-header">
    </section>

    <section class="hot-selling-section">
        <h2>BEST SELLING</h2>
        <div class="hot-selling">
            <figure>
                <img src="Opera Cake.jpeg" alt="cake" class="hot-selling-menu">
                <figcaption>
                    TIRAMISU CAKE PASTRY
                </figcaption>
            </figure>
            <figure>
                <img src="Chocolat Chaud La Recette Classique Ingrédients….jpeg" alt="hot chocolate"
                    class="hot-selling-menu">
                <figcaption>
                    HOT CHOCOLATE
                </figcaption>
            </figure>
            <figure>
                <img src="Light & Crisp Belgian Waffles - Taming of the Spoon.jpeg" alt="waffles"
                    class="hot-selling-menu">
                <figcaption>
                    CRISPY WAFFLES
                </figcaption>
            </figure>
        </div>
    </section>

    <section class="main-menu-section">
        <h2>MAIN MENU</h2>
        <div class="menu">
            <figure>
                <img src="e8e32939-4482-404e-bf32-4ca90e1b6e56.jpeg" alt="coffee" class="main-menu">
                <figcaption>
                    HOT & COLD BEVERAGES
                </figcaption>
            </figure>
            <figure>
                <img src="download (1).jpeg" alt="breakfast" class="main-menu">
                <figcaption>
                    BREKAFAST
                </figcaption>
            </figure>
            <figure>
                <img src="download.jpeg" alt="chocolate pastry" class="main-menu">
                <figcaption>
                    PASTRY AND CAKES
                </figcaption>
            </figure>
        </div>
    </section>

    <footer style="background-color: white;">
        <div class="footer-div">
            <img class="icon" src="instagram.png" alt="instagram">
            <img class="icon" src="facebook.png" alt="facebook">
            <img class="icon" src="home.png" alt="home">
        </div>
        <p class="download-instr">
            Download the App Now
        <p>
        <div class="footer-info-div">
            <div>
                <p>COPYRIGHT: THE SECOND BEAN COFFEE COMPANY INC. 2025</p>
            </div>
            <div>
                <p>CONTACT US | PRIVACY POLICY</p>
            </div>
        </div>
        <div class="developer">DEVELOPED BY ME ;&#41;</div>
    </footer>
