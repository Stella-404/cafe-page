<!DOCTYPE html>
<html>
    <head>
        <style>
            header, .left-header{
                padding: 0px;
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                background-color: white;
                margin: 0px;
            }
            header{
                box-shadow: 0 4px 6px rgba(0,0,0,0.1);
                top: 0;
                left: 0;
                right: 0;
                position: fixed;
            }
            .top-bar-menu{
                display: inline;
                font-family: Arial, Helvetica, sans-serif;
                font-weight: bold;
                margin-right: 30px;
                margin-left: 17px;
                font-size: 18px;
            }
            .icon{
                width: 20px;
                margin-right: 25px;
            }
            .right-header{
                margin-right: 40px;
            }
            .cafe-header{
                /*margin-top: 77px;*/
                width: 100%;
                height: 50%;
                padding: 0;
                margin-bottom: 20px;
            }
            h2{
                color: white;
                font-family: Arial, Helvetica, sans-serif;
                text-align: center;
                margin: 50px 0px;
                font-size: 30px;
            }
            .hot-selling,
            .menu
            {
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                margin: 0px 10px 70px 10px;
            }
            .hot-selling-menu ,
            .main-menu
            {
                width: 100%;
                height: 350px;
                object-fit: cover;
            }
            figcaption{
                font-family: Arial, Helvetica, sans-serif;
                color: white;
                font-size: 19px;
                font-weight: bold;
                text-align: center;
                margin: 15px 0px;
            }
            .footer-div{
                display: flex;
                flex-direction: row;
                justify-content: center;
                align-items: center;
                padding-top: 10px;
            }
            .download-instr{
                text-align: center;
                font-family: Arial, Helvetica, sans-serif;
                font-size: 15px;
                color: rgb(99, 63, 9);
            }
            .footer-info-div{
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                padding: 0px 10px;
                font-weight: bold;
                font-size: 15px;
                color: rgb(99, 63, 9);
            }
            .developer{
                text-align: right;
                font-size: 10px;
                padding-bottom: 10px;
                padding-right: 10px;
                color: rgb(99, 63, 9);
            }
        </style>
    </head>
    <body style="background-color: black;">
        <header>
            <div class="left-header">
                <div>
                    <img src="second bean-Photoroom.png" alt="cafe-logo" 
                    style="width: 120px;
                    margin-right: 40px;
                    margin-left: 30px;">
                </div>
                <div class="middle-header">
                    <p class="top-bar-menu">About</p>
                    <p class="top-bar-menu">Menu</p>
                    <p class="top-bar-menu">Career</p>
                    <p class="top-bar-menu">Location</p>
                </div>
            </div>
            <div class="right-header">
               <img  class="icon" src="instagram.png" alt="instagram">

                <img class="icon" src="facebook.png" alt="facebook">

                <img class="icon" src="home.png" alt="home">
            </div>
        </header>

        <section>
            <img class="cafe-header" src="cafe-header.jpg" alt="cafe-interior-header">
        </section>
        
        <section class="hot-selling-section">
            <h2>BEST SELLING</h2>
            <div class="hot-selling">
                <figure>
                    <img src="Opera Cake.jpeg" alt="cake" class="hot-selling-menu">
                    <figcaption>
                        TIRAMISU CAKE PASTRY
                    </figcaption>
                </figure>
                <figure>
                    <img src="Chocolat Chaud La Recette Classique Ingrédients….jpeg" alt="hot chocolate" class="hot-selling-menu">
                    <figcaption>
                        HOT CHOCOLATE
                    </figcaption>
                </figure>
                <figure>
                    <img src="Light & Crisp Belgian Waffles - Taming of the Spoon.jpeg" alt="waffles" class="hot-selling-menu">
                    <figcaption>
                        CRISPY WAFFLES
                    </figcaption>
                </figure>
            </div>
        </section>

        <section class="main-menu-section">
            <h2>MAIN MENU</h2>
            <div class="menu">
                <figure>
                    <img src="e8e32939-4482-404e-bf32-4ca90e1b6e56.jpeg" alt="coffee" class="main-menu">
                    <figcaption>
                        HOT & COLD BEVERAGES
                    </figcaption>
                </figure>
                <figure>
                    <img src="download (1).jpeg" alt="breakfast" class="main-menu">
                    <figcaption>
                        BREKAFAST
                    </figcaption>
                </figure>
                <figure>
                    <img src="download.jpeg" alt="chocolate pastry" class="main-menu">
                    <figcaption>
                        PASTRY AND CAKES
                    </figcaption>
                </figure>
            </div>
        </section>

        <footer style="background-color: white;">
            <div class="footer-div">
                <img  class="icon" src="instagram.png" alt="instagram">
                <img class="icon" src="facebook.png" alt="facebook">
                <img class="icon" src="home.png" alt="home">
            </div>
            <p class="download-instr">
                Download the App Now
            <p>
            <div class="footer-info-div">
                <div><p>COPYRIGHT: THE SECOND BEAN COFFEE COMPANY INC. 2025</p></div>
                <div><p>CONTACT US | PRIVACY POLICY</p></div>
            </div>
            <div class="developer">DEVELOPED BY ME ;&#41;</div>
        </footer>
    </body>
</html>
